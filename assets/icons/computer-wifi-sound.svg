<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="ttl desc">
  <title id="ttl">Computer with Wi-Fi and sound</title>
  <desc id="desc">A desktop monitor showing a Wi-Fi symbol on its screen, with sound waves on both sides.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <g transform="scale(5.333333)">
    <!-- screen body -->
    <rect x="18" y="22" width="60" height="40" rx="5" fill="#fff" />

    <!-- camera -->
    <circle cx="48" cy="25.5" r="1.3" fill="#c7d2fe" />

    <!-- Wi-Fi on the screen -->
    <path d="M40.58 38.58A10.5 10.5 0 0 1 55.42 38.58" fill="none" stroke="#4f46e5"
          stroke-width="4" stroke-linecap="round" />
    <path d="M44.11 42.11A5.5 5.5 0 0 1 51.89 42.11" fill="none" stroke="#4f46e5"
          stroke-width="4" stroke-linecap="round" />
    <circle cx="48" cy="46" r="2.2" fill="#4f46e5" />

    <!-- stand -->
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
      <path d="M48 62v8" />
      <path d="M36 72h24" />
    </g>

    <!-- sound waves -->
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
      <path d="M13.76 37.76A6 6 0 0 0 13.76 46.24" />
      <path d="M10.22 34.22A11 11 0 0 0 10.22 49.78" />
      <path d="M82.24 37.76A6 6 0 0 1 82.24 46.24" />
      <path d="M85.78 34.22A11 11 0 0 1 85.78 49.78" />
    </g>
  </g>
</svg>
