name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Windows server (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --manifest-path pc-server/pcsoundlink-server/Cargo.toml

      - name: Rename executable
        shell: pwsh
        run: |
          Copy-Item `
            "pc-server/pcsoundlink-server/target/release/pcsoundlink-server.exe" `
            "pc-server/pcsoundlink-server/target/release/PcSoundLinkServer.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: PcSoundLinkServer-windows
          path: pc-server/pcsoundlink-server/target/release/PcSoundLinkServer.exe
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: PcSoundLink-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
